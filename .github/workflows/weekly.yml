name: Weekly LinkedIn draft

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: linkedin-weekly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify LLM configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          providers = [
              name for name in (
                  "ANTHROPIC_API_KEY",
                  "GEMINI_API_KEY",
                  "OPENAI_API_KEY"
              )
              if os.getenv(name)
          ]
          if not providers:
              raise SystemExit("No LLM API key configured")
          print("Available LLM provider credentials:", ", ".join(providers))
          PY

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Show generated files
        run: |
          find drafts -maxdepth 2 -type f -print

      - name: Open PR with draft
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly LinkedIn draft: ${{ github.run_id }}"
          branch: draft/weekly-${{ github.run_id }}
          delete-branch: true
          title: "Weekly LinkedIn draft — review"
          body: |
            Automated LinkedIn draft generated by the weekly pipeline.

            Review files under `drafts/`, edit if needed, then publish manually
            to LinkedIn and merge this PR.
          add-paths: |
            drafts/
