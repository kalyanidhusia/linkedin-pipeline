name: Weekly LinkedIn draft

on:
  # Sunday 13:00 UTC = 8 AM Central / 7 AM Mountain
  schedule:
    - cron: '0 13 * * 0'
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd scripts && python generate_post.py

      - name: Open PR with the draft
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly draft: ${{ github.run_id }}"
          branch: draft/weekly-${{ github.run_id }}
          title: "📝 Weekly LinkedIn draft — review me"
          body: |
            Auto-generated weekly draft. Review the file in `drafts/`,
            edit if needed, and merge when you've posted to LinkedIn.

            **Workflow:**
            1. Open the draft `.md` file in this PR
            2. Edit the post text inline (GitHub web editor is fine)
            3. Copy the final text to LinkedIn and post
            4. (For Type 3) Download the `.png` and attach it to the LinkedIn post
            5. Merge this PR — the draft is archived for future reference

            If you don't like this week's pick, just close the PR. No-op.
          add-paths: |
            drafts/
